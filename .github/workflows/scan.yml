name: Scan volley

on:
  schedule:
    # Every 10 minutes from 7:00 to 23:50 Japan time.
    # GitHub cron is UTC and JST = UTC+9: 22-23 UTC = 7-8 JST, 0-14 UTC = 9-23 JST.
    - cron: "*/10 22-23,0-14 * * *"
  workflow_dispatch:   # "Run workflow" button for manual runs

permissions:
  contents: read

concurrency:
  group: scan-volley   # never two scans at the same time
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore last state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}
          restore-keys: bot-state-

      - name: Scan and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: bot-state-${{ github.run_id }}

      - name: Keep the last portal response for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
