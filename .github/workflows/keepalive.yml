name: Keepalive

# GitHub turns off scheduled workflows in public repos after 60 days without
# any repository activity. The scan never commits, so once a month this
# pushes an empty commit to keep "Scan volley" enabled.
on:
  schedule:
    - cron: "0 3 1 * *"   # 1st of every month, 12:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898279+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive (keeps the scheduled scan enabled)"
          git push
