# Bot settings. Edit, commit, and they apply from the next run.

# Sport searched on the portal: 5 = volleyball 6-a-side (バレーボール ６人制), 6 = 9-a-side (９人制)
purpose: 5

# Gyms to check, written exactly as on the portal.
# Other options: 神奈川スポーツセンター (Kanagawa), 南スポーツセンター (Minami),
# 旭スポーツセンター (Asahi), 緑スポーツセンター (Midori), 戸塚スポーツセンター (Totsuka)
gyms:
  - 港北スポーツセンター

# Which free slots you care about. A slot is reported if it matches
# AT LEAST ONE rule. An empty rule "{}" = every slot.
# Possible fields in a rule (all optional):
#   rooms: [第一体育室（全面）]      allowed rooms (empty = all)
#   time_from: "13:00"            the slot must start at this time or later
#   time_to: "21:00"              the slot must end at this time or earlier
#   min_duration_minutes: 120     minimum slot length
#   weekdays: [Sat, Sun]          allowed days: Mon Tue Wed Thu Fri Sat Sun
rules:
  - {}
  # Example: only Saturday and Sunday from the afternoon
  # - weekdays: [Sat, Sun]
  #   time_from: "13:00"

# Also send a message when a slot disappears (someone booked it)?
notify_gone: false

# Send a message even when nothing changed? (not recommended: every 10 minutes)
notify_no_change: false

# If the bot breaks, alert at most once every N hours.
error_alert_every_hours: 6
